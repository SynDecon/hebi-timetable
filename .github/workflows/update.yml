name: 更新课表

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "发布内容（half 只发一半课程，用于测试手机刷新；测完记得重跑 full）"
        type: choice
        options:
          - full
          - half
        default: full

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      valid: ${{ steps.fetch.outputs.valid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成
        id: fetch
        env:
          SCHOOL_USER: ${{ secrets.SCHOOL_USER }}
          SCHOOL_PASS: ${{ secrets.SCHOOL_PASS }}
          PUBLISH_HALF: ${{ inputs.mode == 'half' }}
        run: python -m src.main

      - name: 打包
        if: steps.fetch.outputs.valid == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: 错误信息
        if: failure()
        run: echo "::error::课表同步失败，线上文件未更新。${{ steps.fetch.outputs.error }}"

      - name: 清理缓存
        if: always()
        run: rm -rf src/__pycache__ .cache output/*.tmp

  deploy:
    needs: sync
    if: needs.sync.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4